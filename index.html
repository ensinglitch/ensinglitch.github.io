<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor de Nivel IoT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background-color: #009d71; /* Fondo que pediste */
            color: #E7DBCB;    /* Letras que pediste */
            padding-top: 30px; 
        }
        .container { 
            max-width: 450px; 
            margin: 0 auto; 
            background: #00674F; /* Marco principal que pediste */
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
        }
        
        /* Sección del Estado del Motor */
        .motor-section {
            background: rgba(0, 0, 0, 0.15); /* Un fondo sutil para separar secciones */
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid rgba(231, 219, 203, 0.2);
        }
        #estado-motor {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }
        /* Colores para cuando cambie el estado */
        .encendido { color: #2ecc71; } /* Verde vibrante */
        .apagado { color: #e74c3c; }   /* Rojo vibrante */

        /* Sección del Sensor de Nivel */
        .sensor-section { 
            margin-top: 20px; 
            background: rgba(0, 0, 0, 0.15); 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid rgba(231, 219, 203, 0.2);
        }
        .progress-bar-container { 
            background-color: rgba(0, 0, 0, 0.3); 
            border-radius: 10px; 
            width: 100%; 
            height: 25px; 
            margin-top: 15px; 
            overflow: hidden; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .progress-bar { 
            background-color: #E7DBCB; /* Barra del color de las letras para contrastar */
            width: 0%; 
            height: 100%; 
            transition: width 0.3s ease; 
        }
        #valor-sensor { 
            font-size: 36px; 
            font-weight: bold; 
            color: #E7DBCB; 
            margin: 10px 0; 
        }
        
        #status { margin-top: 20px; font-size: 13px; color: #E7DBCB; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sensor de Nivel</h2>
        <p style="opacity: 0.8; margin-top: -10px;">Monitoreo y Control Automático</p>
        <hr style="border-color: rgba(231, 219, 203, 0.2);">
        
        <div class="motor-section">
            <h3>Estado del Motor</h3>
            <div id="estado-motor">ESPERANDO DATOS...</div>
        </div>
        
        <div class="sensor-section">
            <h3>Porcentaje de Llenado</h3>
            <div id="valor-sensor">0%</div>
            <div class="progress-bar-container">
                <div id="barra" class="progress-bar"></div>
            </div>
        </div>
        
        <div id="status">Conectando al servidor...</div>
    </div>

    <script>
        // Configuración Segura para GitHub Pages
        const broker = "broker.hivemq.com";
        const puerto = 8884; 
        
        // Tópicos actualizados para coincidir con tu ESP32
        const topic_nivel = "angel_IOT_ISA_9876/esp32/nivel"; 
        const topic_motor = "angel_IOT_ISA_9876/esp32/motor"; 
        
        const clientId = "WebClientNivel-" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client(broker, puerto, clientId);

        client.onConnectionLost = (resp) => {
            document.getElementById("status").innerText = "Conexión perdida: " + resp.errorMessage;
            document.getElementById("status").style.color = "#e74c3c";
        };

        // Función que procesa los datos que llegan de la placa
        client.onMessageArrived = (message) => {
            const valor = message.payloadString;
            
            // 1. Si el mensaje es el porcentaje del tanque
            if (message.destinationName === topic_nivel) {
                document.getElementById("valor-sensor").innerText = valor + "%";
                document.getElementById("barra").style.width = valor + "%";
            }
            
            // 2. Si el mensaje es el estado del motor (ON/OFF)
            if (message.destinationName === topic_motor) {
                const divMotor = document.getElementById("estado-motor");
                
                if (valor === "ON") {
                    divMotor.innerText = "ENCENDIDO";
                    divMotor.className = "encendido"; // Pone el texto en verde
                } else if (valor === "OFF") {
                    divMotor.innerText = "APAGADO";
                    divMotor.className = "apagado";   // Pone el texto en rojo
                }
            }
        };

        client.connect({
            useSSL: true,
            onSuccess: () => {
                document.getElementById("status").innerText = "● Sistema Online - Recibiendo Telemetría";
                
                // Nos suscribimos a AMBOS tópicos para leer nivel y motor
                client.subscribe(topic_nivel);
                client.subscribe(topic_motor);
            },
            onFailure: (err) => {
                document.getElementById("status").innerText = "Error de conexión: " + err.errorMessage;
                document.getElementById("status").style.color = "#e74c3c";
            }
        });
    </script>
</body>
</html>
